[package]
name = "tomodachi-texture-tool"
version = "0.2.0"
edition = "2021"

[dependencies]
tauri           = { version = "2", features = [] }
tauri-plugin-dialog = "2"
window-vibrancy = "0.5"
image           = { version = "0.25", default-features = false, features = ["png"] }
squish          = "1.0"
zstd            = "0.13"
base64          = "0.22"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
tokio           = { version = "1", features = ["rt"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
