name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Step 1: Create the GitHub Release first ───────────────────────────────────
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Tomodachi Texture Tool ${{ github.ref_name }}" \
            --notes "Custom texture converter for Tomodachi Life (Nintendo Switch / Emulator).

          ### Download
          | Platform | File |
          |----------|------|
          | Windows  | \`TomodachiTextureTool.exe\` — portable, einfach starten |
          | macOS (Apple Silicon) | \`_aarch64.dmg\` |
          | Linux | \`.AppImage\` or \`.deb\` |"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 2: Build on all platforms and upload ─────────────────────────────────
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      # ── Windows: portable .exe ──────────────────────────────────────────────
      - name: Build portable exe
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --bundles none

      - name: Rename exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: mv src-tauri/target/release/tomodachi-texture-tool.exe src-tauri/target/release/TomodachiTextureTool.exe

      - name: Upload exe to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: gh release upload ${{ github.ref_name }} src-tauri/target/release/TomodachiTextureTool.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS + Linux: normal bundles ───────────────────────────────────────
      - name: Build and upload bundles
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tomodachi Texture Tool ${{ github.ref_name }}'
          releaseBody: |
            Custom texture converter for Tomodachi Life (Nintendo Switch / Emulator).

            ### Download
            | Platform | File |
            |----------|------|
            | Windows  | `TomodachiTextureTool.exe` — portable, einfach starten |
            | macOS (Apple Silicon) | `_aarch64.dmg` |
            | Linux | `.AppImage` or `.deb` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args || '' }}
